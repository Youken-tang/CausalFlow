# configure file for simulation execution
time_management = Sequential      #Options: Sequential, Conservative, SyncConShm
end_time = 20
lookahead = 0.1
num_threads = 1
scale_or_not = false
scale_ratio = 10000, 2.0
precision = 0.001
schedule_mode = static
profiler = false
ensure_level = 1
debug_level = 0